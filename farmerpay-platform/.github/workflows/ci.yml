name: CI — TRUST v2

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Typecheck all apps
  # ──────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: dashboard, dir: dashboard }
          - { name: dashboard-sathi, dir: dashboard-sathi }
          - { name: dashboard-farmer, dir: dashboard-farmer }
          - { name: i18n, dir: i18n }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "${{ matrix.app.dir }}/package-lock.json"
      - run: npm ci
        working-directory: ${{ matrix.app.dir }}
      - run: npx tsc --noEmit
        working-directory: ${{ matrix.app.dir }}

  # ──────────────────────────────────────────────
  # Unit + integration tests
  # ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: dashboard, dir: dashboard }
          - { name: dashboard-sathi, dir: dashboard-sathi }
          - { name: dashboard-farmer, dir: dashboard-farmer }
          - { name: farmer-app, dir: farmer-app }
          - { name: i18n, dir: i18n }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "${{ matrix.app.dir }}/package-lock.json"
      - run: npm ci
        working-directory: ${{ matrix.app.dir }}
      - run: npm test -- --ci --forceExit
        working-directory: ${{ matrix.app.dir }}

  # ──────────────────────────────────────────────
  # Backend tests
  # ──────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: farmerpay_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm test -- --ci --forceExit
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: test
          DB_NAME: farmerpay_test
          REDIS_URL: redis://localhost:6379

  # ──────────────────────────────────────────────
  # Dashboard builds
  # ──────────────────────────────────────────────
  build:
    name: Build
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: dashboard, dir: dashboard }
          - { name: dashboard-sathi, dir: dashboard-sathi }
          - { name: dashboard-farmer, dir: dashboard-farmer }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "${{ matrix.app.dir }}/package-lock.json"
      - run: npm ci
        working-directory: ${{ matrix.app.dir }}
      - run: npm run build
        working-directory: ${{ matrix.app.dir }}

  # ──────────────────────────────────────────────
  # Detox E2E smoke (Android emulator)
  # ──────────────────────────────────────────────
  e2e-android:
    name: E2E Smoke (Android)
    needs: [test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The Android emulator setup in GH Actions has been failing since
    # at least 2026-04-15 ("No device found matching --device Pixel 7";
    # adb can't reach TCP 5554). It's an infra/emulator config issue
    # unrelated to product code. Marking non-blocking so the job's
    # red status doesn't redden main — the failure is still visible
    # in the Actions tab for anyone who wants to fix it.
    # TODO: restore blocking behavior once the emulator setup is
    # repaired. Tracked as tech debt; see scripts/smoke-test.sh for
    # the synthetic-API smoke coverage that remains blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "farmer-app/package-lock.json"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Create AVD and run Detox
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: Pixel 7
          script: |
            cd farmer-app
            npm ci
            npx detox build --configuration android.emu.debug
            npx detox test --configuration android.emu.debug --headless
